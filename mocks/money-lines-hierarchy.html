<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Lines Hierarchy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Today's money, Money in and Money out lines only. Four looks behind one switch. Light mode only. */
:root{
  color-scheme:light;
  --page:#F8F5EF; --card:#FFFFFF; --soft:rgba(28,28,28,.12); --main:#1F1F1F; --muted:#6E6E6E; --faint:#A99C82;
  --gold:#D0AB60; --gold100:#F5EAD1; --gold800:#6F5420; --emerald:#059669; --emerald50:#ECFDF5;
  --danger:#A32F22; --danger50:#FBEDEA; --paper100:#F1ECE1; --paper200:#E6DFD0; --blue:#1D4ED8; --ink:#1C1C1C;
  --sans:"DM Sans",system-ui,sans-serif; --display:"Sora",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--main);font-family:var(--sans);font-size:13px;padding:28px 16px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.switch{display:inline-flex;gap:4px;background:var(--paper100);padding:4px;border-radius:12px;flex-wrap:wrap}
.switch button{border:0;background:transparent;font:700 12.5px var(--sans);color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;transition:background-color .2s,color .2s}
.switch button[aria-pressed="true"]{background:var(--card);color:var(--main);box-shadow:0 1px 0 var(--soft)}
.card{background:var(--card);border:1px solid var(--soft);border-radius:16px;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:820px){.card{grid-template-columns:1fr}.col+.col{border-left:0!important;border-top:1px solid var(--soft)}}
.col{padding:16px;display:flex;flex-direction:column;min-width:0}
.col+.col{border-left:1px solid var(--soft)}
.label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.total{margin-top:12px;border-top:1px solid var(--soft);padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px}
.total b{font-family:var(--mono);font-size:18px}
.in{color:var(--emerald)} .out{color:var(--danger)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--soft);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}
.note b{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px}
.note strong{color:var(--main);display:block;font-size:12.5px}
.cat2{font-weight:700;color:#3D3D3D;text-transform:capitalize}
.pay{display:inline-flex;align-items:center;font-weight:800;color:var(--main);background:var(--paper100);padding:0 8px 0 7px;border-radius:99px;font-size:11.5px;line-height:18px}
.pay .dot{margin-right:5px;vertical-align:0}
.pane{display:none}
.pane.on{display:contents}
.pane.on .row{animation:rise .35s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.pane.on .row{animation:none}}

/* shared row bits */
.row{position:relative;display:grid;border-radius:10px;padding:8px;margin:0 -8px;cursor:pointer;transition:background-color .15s,transform .1s}
.row:hover{background:var(--page)}
.row:active{transform:scale(.985)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mono{font-family:var(--mono)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
.cash{background:var(--emerald)} .gcash{background:var(--blue)}
.pen{width:28px;height:28px;margin:-6px -6px -6px 0;display:grid;place-items:center;border-radius:9px;color:var(--gold800);border:0;background:none;cursor:pointer}
.pen:hover{background:var(--gold100)}
.pen svg{width:14px;height:14px}
.chev{width:14px;height:14px;color:#A9812F}
.count{display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px}
.count.in{background:var(--emerald50)} .count.out{background:var(--danger50)}

/* ── Today (as built) ── */
.t .row{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.t .who{font-weight:700}
.t .chip{display:inline-block;font-size:10.5px;font-weight:800;padding:0 6px;border-radius:6px;background:var(--paper100);margin-left:6px;vertical-align:1px}
.t .chip.food{background:var(--gold100);color:var(--gold800)}
.t .code{display:inline-block;font:500 10.5px var(--mono);padding:0 4px;border-radius:6px;border:1px solid var(--paper200);color:var(--muted);margin-left:6px;vertical-align:1px}
.t .amt{justify-self:end;font:700 14px var(--mono)}
.t .sub{font-size:12px;color:var(--muted)}
.t .right{justify-self:end;display:flex;align-items:center;gap:4px;font:400 11px var(--mono);color:var(--muted)}
.t .cat{font-weight:700}

/* ── A · One loud thing per row ── */
.a .row{grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;align-items:baseline}
.a .who{font-weight:700;font-size:13.5px;text-transform:capitalize}
.a .place{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.a .amt{justify-self:end;font:800 16px var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.a .sub{font-size:12px;color:var(--muted)}
.a .codes{justify-self:end;display:flex;align-items:center;gap:6px;font:400 10.5px var(--mono);color:var(--faint)}
.a .pen{opacity:0;transition:opacity .15s}
.a .row:hover .pen,.a .pen:focus-visible{opacity:1}
@media (hover:none){.a .pen{opacity:1}}
.a .row+.row{border-top:1px solid transparent}

/* ── B · Time down the side ── */
.b .row{grid-template-columns:64px minmax(0,1fr) auto;gap:3px 12px;align-items:baseline}
.b .time{grid-row:span 2;align-self:stretch;position:relative;font:500 11.5px var(--mono);color:var(--muted);padding:1px 18px 0 0;text-align:right}
.b .time::before{content:"";position:absolute;right:4px;top:-8px;bottom:-8px;width:1.5px;background:var(--paper200)}
.b .row:first-child .time::before{top:6px}.b .row:last-child .time::before{bottom:calc(100% - 10px)}
.b .time::after{content:"";position:absolute;right:0;top:3px;width:6px;height:6px;border-radius:50%;background:var(--card);border:2px solid currentColor}
.b .inrow .time::after{color:var(--emerald)}.b .outrow .time::after{color:var(--danger)}
.b .time small{display:block;font-size:10px;color:var(--faint)}
.b .who{font-weight:700;font-size:13.5px;text-transform:capitalize}
.b .place{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.b .amt{justify-self:end;font:800 16px var(--display);font-variant-numeric:tabular-nums}
.b .sub{font-size:12px;color:var(--muted)}
.b .codes{justify-self:end;display:flex;align-items:center;gap:6px;font:400 10.5px var(--mono);color:var(--faint)}
.b .pen{opacity:0;transition:opacity .15s}
.b .row:hover .pen{opacity:1}
@media (hover:none){.b .pen{opacity:1}}

.b .list{position:relative}


/* ── C · Kind badge ── */
.c .row{grid-template-columns:34px minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.c .ico{grid-row:span 2;width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.c .ico svg{width:17px;height:17px}
.c .ico.room{background:var(--paper100);color:var(--main)}
.c .ico.food{background:var(--gold100);color:var(--gold800)}
.c .ico.spend{background:var(--danger50);color:var(--danger)}
.c .who{font-weight:700;font-size:13.5px;text-transform:capitalize}
.c .place{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.c .amt{justify-self:end;font:800 16px var(--display);font-variant-numeric:tabular-nums}
.c .sub{font-size:12px;color:var(--muted)}
.c .codes{justify-self:end;display:flex;align-items:center;gap:6px;font:400 10.5px var(--mono);color:var(--faint)}
.c .pen{opacity:0;transition:opacity .15s}
.c .row:hover .pen{opacity:1}
@media (hover:none){.c .pen{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Money lines</h1>
    <div class="switch" role="group" aria-label="Look">
      <button data-v="t" aria-pressed="false">Today</button>
      <button data-v="a" aria-pressed="true">A · One loud thing</button>
      <button data-v="b" aria-pressed="false">B · Time line</button>
      <button data-v="c" aria-pressed="false">C · Kind badge</button>
    </div>
  </div>

  <div class="card" id="card"></div>

  <div class="notes" id="notes"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></symbol>
  <symbol id="tree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-7M8 15h8l-4-11z"/></symbol>
  <symbol id="fork" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
  <symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
  <symbol id="egg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7.5S16 2 12 2 5 10 5 14.5 8 22 12 22z"/></symbol>
</svg>

<script>
const IN = [
  {who:'MAPUE, SAMANTHA SOPHIA', place:'Garden Area', bill:'GRF-2026-10-0096', what:'Full pay', how:'Cash', t:'12:52 AM', pr:'PR-202610-174', amt:'₱3,000', ico:'tree', kind:'room'},
  {who:'Table 11', place:'OS-0083', food:true, what:'Order slip', how:'Cash', t:'1:00 AM', pr:'PR-202611-008', amt:'₱3,570', ico:'fork', kind:'food'},
  {who:'EAGLES', place:'Gazebo', bill:'202610-1681-1681', what:'Full pay', how:'Cash', t:'1:06 AM', pr:'PR-202610-175', amt:'₱19,000', ico:'tree', kind:'room'},
  {who:'DELA CRUZ, MARK', place:'Room 4', bill:'202611-0012', what:'Deposit', how:'GCash', t:'9:41 AM', pr:'PR-202611-009', amt:'₱1,250', ico:'bed', kind:'room'},
];
const OUT = [
  {cat:'Salary', n:2, sub:'ERIKA · DANNY CATER', t:'10:22–10:23 AM', t1:'10:22 AM', amt:'₱2,550', ico:'user'},
  {cat:'Cash Advance', sub:'MATET', t:'10:25 AM', t1:'10:25 AM', amt:'₱1,500', ico:'hand'},
  {cat:'Resto Expenses', n:2, sub:'2 TRAY EGG · PIPINO', t:'10:26–10:27 AM', t1:'10:26 AM', amt:'₱520', ico:'egg'},
];
const pen = '<button class="pen" aria-label="Edit"><svg><use href="#pen"/></svg></button>';
const chev = '<svg class="chev"><use href="#chev"/></svg>';
const title = s => s === s.toUpperCase() ? s.toLowerCase() : s;
const tm = s => s.replace(/ (AM|PM)/, '<small>$1</small>');

const render = {
  t: () => [
    IN.map((r,i) => `<div class="row" style="--i:${i}">
      <span class="trunc who">${r.who}<span class="chip ${r.food?'food':''}">${r.place}</span>${r.bill?`<span class="code">${r.bill}</span>`:''}</span>
      <span class="amt in">${r.amt}</span>
      <span class="trunc sub">${r.what} · <span class="dot ${r.how==='Cash'?'cash':'gcash'}"></span>${r.how} · ${r.t}</span>
      <span class="right">${r.pr}${pen}</span></div>`).join(''),
    OUT.map((r,i) => `<div class="row" style="--i:${i}">
      <span class="trunc cat">${r.cat}${r.n?`<span class="count out">×${r.n}</span>`:''}</span>
      <span class="amt out" style="display:flex;gap:6px;align-items:center">${r.amt}${r.n?chev:''}</span>
      <span class="trunc sub">${r.sub} · ${r.t}</span>
      <span class="right">${r.n?r.t:pen}</span></div>`).join('')
  ],
  a: () => [
    IN.map((r,i) => `<div class="row" style="--i:${i}">
      <span class="trunc"><span class="who">${r.food?'Restaurant':r.place}</span></span>
      <span class="amt in" style="display:flex;align-items:center;gap:8px"><span class="pay"><span class="dot ${r.how==='Cash'?'cash':'gcash'}"></span>${r.how}</span>${r.amt}</span>
      <span class="trunc sub"><span class="cat2">${title(r.who)}</span> · ${r.what}${r.food?' · '+r.place:''}</span>
      <span class="codes">${r.t} · ${r.pr}${pen}</span></div>`).join(''),
    OUT.map((r,i) => `<div class="row" style="--i:${i}">
      <span class="trunc"><span class="who">${title(r.sub)}</span>${r.n?`<span class="count out">${r.n}</span>`:''}</span>
      <span class="amt out" style="display:flex;gap:6px;align-items:center">${r.amt}${r.n?chev:''}</span>
      <span class="trunc sub"><span class="cat2">${r.cat}</span> · ${r.t}</span>
      <span class="codes">${r.n?'':pen}</span></div>`).join('')
  ],
  b: () => [
    '<div class="list">' + IN.map((r,i) => `<div class="row inrow" style="--i:${i}">
      <span class="time">${tm(r.t)}</span>
      <span class="trunc"><span class="who">${r.food?'Restaurant':r.place}</span></span>
      <span class="amt in" style="display:flex;align-items:center;gap:8px"><span class="pay"><span class="dot ${r.how==='Cash'?'cash':'gcash'}"></span>${r.how}</span>${r.amt}</span>
      <span class="trunc sub"><span class="cat2">${title(r.who)}</span> · ${r.what}${r.food?' · '+r.place:''}</span>
      <span class="codes">${r.pr}${pen}</span></div>`).join('') + '</div>',
    '<div class="list">' + OUT.map((r,i) => `<div class="row outrow" style="--i:${i}">
      <span class="time">${tm(r.t1)}</span>
      <span class="trunc"><span class="who">${title(r.sub)}</span>${r.n?`<span class="count out">${r.n}</span>`:''}</span>
      <span class="amt out" style="display:flex;gap:6px;align-items:center">${r.amt}${r.n?chev:''}</span>
      <span class="trunc sub"><span class="cat2">${r.cat}</span></span>
      <span class="codes">${r.n?'':pen}</span></div>`).join('') + '</div>'
  ],
  c: () => [
    IN.map((r,i) => `<div class="row" style="--i:${i}">
      <span class="ico ${r.kind}"><svg><use href="#${r.ico}"/></svg></span>
      <span class="trunc"><span class="who">${r.food?'Restaurant':r.place}</span></span>
      <span class="amt in" style="display:flex;align-items:center;gap:8px"><span class="pay"><span class="dot ${r.how==='Cash'?'cash':'gcash'}"></span>${r.how}</span>${r.amt}</span>
      <span class="trunc sub"><span class="cat2">${title(r.who)}</span> · ${r.what}${r.food?' · '+r.place:''}</span>
      <span class="codes">${r.t} · ${r.pr}${pen}</span></div>`).join(''),
    OUT.map((r,i) => `<div class="row" style="--i:${i}">
      <span class="ico spend"><svg><use href="#${r.ico}"/></svg></span>
      <span class="trunc"><span class="who">${title(r.sub)}</span>${r.n?`<span class="count out">${r.n}</span>`:''}</span>
      <span class="amt out" style="display:flex;gap:6px;align-items:center">${r.amt}${r.n?chev:''}</span>
      <span class="trunc sub"><span class="cat2">${r.cat}</span> · ${r.t}</span>
      <span class="codes">${r.n?'':pen}</span></div>`).join('')
  ],
};

const NOTES = {
  t: [['1','Five things shout','Name, place chip, bill code, amount and pencil all weigh the same.'],['2','Codes beside the name','The bill number sits in the line you read first.'],['3','Pencil on every row','Repeated down the list; it pulls the eye to the right edge.']],
  a: [['Visual weight','One loud thing','The amount is the only heavy figure; the name is second.'],['Progressive disclosure','Codes step back','Bill number lives on the bill; the receipt number fades to the corner.'],['Contextual action','Pencil on hover','Shows on the row you point at. Always there on a tablet.']],
  b: [['Scan line','Time leads','Read the day top to bottom like the paper ledger, oldest first.'],['Visual anchor','A dot per line','Green in, red out — the column tells you which side at a glance.'],['Contextual action','Pencil on hover','Same as A.']],
  c: [['Recognition over reading','A sign per kind','Room, venue, food, salary — known before the words are read.'],['Visual weight','One loud thing','As A: the amount leads, codes fade.'],['Contextual action','Pencil on hover','Same as A.']],
};

function show(v){
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  const [i,o] = render[v]();
  document.getElementById('card').innerHTML = `
    <div class="col ${v}"><p class="label">Money in</p><div class="pane on">${i}</div>
      <div class="total"><span>Total in</span><b class="in">₱26,820</b></div></div>
    <div class="col ${v}"><p class="label">Money out</p><div class="pane on">${o}</div>
      <div class="total"><span>Total out</span><b class="out">₱4,570</b></div></div>`;
  document.getElementById('notes').innerHTML = NOTES[v].map(([n,h,p]) =>
    `<div class="note"><b>${n.length>2?'•':n}</b><span><strong>${n.length>2?n+' · '+h:h}</strong>${p}</span></div>`).join('');
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => show(b.dataset.v));
show('a');
</script>
</body>
</html>
